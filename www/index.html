<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyShot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Suez+One&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F8;--surface:#FFFFFF;--surface-2:#E8ECF4;
  --ink:#18224F;--ink-2:#4B5479;--ink-3:#757E9F;
  --line:#DCE1EB;--seg-todo:#DDE2EC;--seg-done:#8F9BD1;
  --hl:#F7D84A;--hl-ink:#352B00;--hl-note:#FCF1BE;--hl-note-ink:#3D3200;
  --ok:#1D7A55;--ok-soft:#DCF0E5;
  --warn:#8F5205;--warn-soft:#FBEACF;
  --alert:#B3302A;--alert-soft:#F8DEDB;
  --btn:#18224F;--btn-ink:#FFFFFF;
  --scrim:rgba(12,17,40,.5);
  --font-ui:"IBM Plex Sans Hebrew","Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --font-display:"Suez One","Frank Ruhl Libre","Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
  padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1430;--surface:#162047;--surface-2:#1F2A57;
    --ink:#E9ECFB;--ink-2:#A9B1D6;--ink-3:#8790BA;
    --line:#2A3566;--seg-todo:#28336A;--seg-done:#5867B8;
    --hl:#F2D03B;--hl-ink:#2A2200;--hl-note:#3D3714;--hl-note-ink:#F6E39A;
    --ok:#5BD0A2;--ok-soft:#173D33;
    --warn:#F3B058;--warn-soft:#45310F;
    --alert:#FF8279;--alert-soft:#4D1F24;
    --btn:#E9ECFB;--btn-ink:#0E1430;
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1430;--surface:#162047;--surface-2:#1F2A57;
  --ink:#E9ECFB;--ink-2:#A9B1D6;--ink-3:#8790BA;
  --line:#2A3566;--seg-todo:#28336A;--seg-done:#5867B8;
  --hl:#F2D03B;--hl-ink:#2A2200;--hl-note:#3D3714;--hl-note-ink:#F6E39A;
  --ok:#5BD0A2;--ok-soft:#173D33;
  --warn:#F3B058;--warn-soft:#45310F;
  --alert:#FF8279;--alert-soft:#4D1F24;
  --btn:#E9ECFB;--btn-ink:#0E1430;
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
html{scroll-padding-top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 64px);-webkit-text-size-adjust:100%;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
body.lock{overflow:hidden;}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:10;background:var(--paper);}
h1,h2,h3,p{margin:0;}
h1,h2,h3{font-weight:400;}
button{font:inherit;color:inherit;}
[hidden]{display:none!important;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.num{font-variant-numeric:tabular-nums;}
bdi{unicode-bidi:isolate;}

/* header */
.top{position:sticky;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:20;background:var(--paper);border-bottom:1px solid transparent;transition:border-color .2s;}
.top.scrolled{border-bottom-color:var(--line);}
.top-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding-block:8px;padding-inline:18px 8px;}
.brand{font-family:var(--font-display);font-size:22px;line-height:1.1;}
.top-side{display:flex;align-items:center;gap:2px;}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;}
.icon-btn:hover{background:var(--surface-2);}
.icon-btn svg,.tab svg,.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* layout */
main{max-width:560px;margin:0 auto;padding:2px 16px 96px;}
.h-section{font-family:var(--font-display);font-size:21px;line-height:1.25;margin:32px 2px 12px;}
.h-sub{font-weight:600;font-size:15px;margin:20px 2px 8px;}
.lead{color:var(--ink-2);margin:-4px 2px 12px;font-size:15px;}
.tiny{font-size:12.5px;line-height:1.5;}
.small{font-size:14px;}
.muted{color:var(--ink-2);}
.faint{color:var(--ink-3);}
.mt{margin-top:12px;}
.center{text-align:center;}
.banner{margin:6px 0 0;padding:10px 12px;border-radius:12px;font-size:13.5px;background:var(--surface-2);color:var(--ink-2);}
.loading{padding:80px 0;text-align:center;color:var(--ink-2);}

/* hero dial */
.hero{text-align:center;padding:4px 0 0;}
.dial-wrap{position:relative;width:min(76vw,300px);aspect-ratio:1/1;margin:0 auto;}
.dial{width:100%;height:100%;display:block;overflow:visible;}
.seg{fill:none;stroke-width:22;transition:stroke .3s;}
.seg.todo{stroke:var(--seg-todo);}
.seg.done{stroke:var(--seg-done);}
.seg.now{stroke:var(--ink);}
.seg.due{stroke:var(--hl);}
.seg.late{stroke:var(--alert);}
.seg.over{stroke:var(--alert-soft);}
.sdot{fill:var(--alert);}
.lbl{font:500 13px var(--font-ui);fill:var(--ink-3);text-anchor:middle;dominant-baseline:central;}
.lbl.today{fill:var(--ink);font-weight:700;}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 21%;}
.dial-big{font-family:var(--font-display);font-size:clamp(52px,17vw,76px);line-height:.95;}
.dial-big.word{font-size:clamp(32px,10.5vw,46px);line-height:1.05;}
.dial-cap{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.35;}
.hero-line{margin:6px 0 0;font-size:16px;}
.hero-line b{font-weight:600;}
.hero .btn{margin-top:14px;min-width:220px;}
@keyframes stamp{0%{transform:scale(1.22);opacity:0}55%{transform:scale(.96);opacity:1}100%{transform:scale(1)}}
.dial-wrap.stamped .dial-center{animation:stamp .5s cubic-bezier(.2,.8,.2,1);}
@media (prefers-reduced-motion:reduce){.dial-wrap.stamped .dial-center{animation:none}.seg{transition:none}}

.note{border-radius:12px;padding:10px 13px;font-size:14px;line-height:1.5;text-align:start;margin:12px 0 0;}
.note.warn{background:var(--warn-soft);color:var(--warn);}
.note.alert{background:var(--alert-soft);color:var(--alert);}
.note.info{background:var(--surface-2);color:var(--ink);}
.note.hl{background:var(--hl-note);color:var(--hl-note-ink);}
.note b{font-weight:600;}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 0;padding:0;border-block:1px solid var(--line);}
.stats>div{padding:12px 6px;text-align:center;min-width:0;}
.stats>div+div{border-inline-start:1px solid var(--line);}
.stats dt{font-size:12.5px;color:var(--ink-2);}
.stats dd{margin:3px 0 0;font-family:var(--font-display);font-size:20px;line-height:1.2;}

/* groups & rows */
.group{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:54px;}
.row+.row{border-top:1px solid var(--line);}
.row.col{flex-direction:column;align-items:stretch;gap:10px;}
.rowline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.grow{flex:1;min-width:0;}
.row-title{font-weight:500;}
.row-sub{font-size:13.5px;color:var(--ink-2);}
button.row,a.row{appearance:none;border:0;background:transparent;width:100%;text-align:start;cursor:pointer;text-decoration:none;color:inherit;}
button.row:hover{background:var(--surface-2);}
.row .end{flex:none;text-align:end;}
.chev{width:18px;height:18px;flex:none;color:var(--ink-3);}
.row.add{color:var(--ink);font-weight:500;}
.row.add .ico{width:20px;height:20px;}
.empty{padding:18px 16px;color:var(--ink-2);font-size:14.5px;}

/* buttons */
.btn{appearance:none;border:0;font-weight:600;border-radius:12px;padding:12px 18px;background:var(--btn);color:var(--btn-ink);cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn:disabled{opacity:.55;cursor:default;}
.btn.secondary{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);}
.btn.quiet{background:var(--surface-2);color:var(--ink);}
.btn.danger{background:transparent;color:var(--alert);box-shadow:inset 0 0 0 1.5px var(--alert);}
.btn.block{width:100%;}
.btn.sm{min-height:38px;padding:8px 14px;font-size:14.5px;border-radius:10px;}
.btn-row{display:flex;gap:10px;}
.btn-row>.btn{flex:1;}
.link{appearance:none;border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500;}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{appearance:none;border:0;font-size:14.5px;line-height:1.3;padding:8px 13px;border-radius:999px;background:var(--surface-2);color:var(--ink);cursor:pointer;min-height:38px;}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);}
.chip.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);}
.chip.out{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2);}
.chip.out[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);box-shadow:none;}
.chip.file-btn{display:inline-flex;align-items:center;}
.seg-ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.seg-ctl .chip{border-radius:10px;padding:8px 4px;text-align:center;}

/* daily tracking */
.glasses{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.glass{appearance:none;border:0;background:transparent;padding:0;width:28px;height:34px;cursor:pointer;color:var(--ink);}
.glass svg{width:100%;height:100%;}
.glass .g-out{fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-linejoin:round;}
.glass .g-in{fill:transparent;}
.glass.on .g-out{stroke:var(--ink);}
.glass.on .g-in{fill:var(--ink);}
.pbar{height:8px;border-radius:99px;background:var(--seg-todo);overflow:hidden;}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:99px;}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.face{appearance:none;border:0;border-radius:12px;background:var(--surface-2);font-size:24px;line-height:1;padding:8px 0;cursor:pointer;}
.face[aria-pressed="true"]{background:var(--btn);}

/* heads-up */
.headsup{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:14.5px;}
.headsup b{font-weight:600;}

/* sites */
.sites{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:stretch;}
.sites .colh{font-size:12.5px;color:var(--ink-2);text-align:center;align-self:end;}
.sites .rowh{font-weight:500;align-self:center;padding-inline-end:4px;font-size:15px;}
.site{appearance:none;border:0;color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:14px;padding:9px 6px;text-align:center;cursor:pointer;min-height:56px;font-size:14px;line-height:1.3;}
.site small{display:block;font-size:12px;color:var(--ink-2);margin-top:2px;}
.site.rec{background:var(--hl);color:var(--hl-ink);box-shadow:none;}
.site.rec small{color:var(--hl-ink);}
.site[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);box-shadow:none;}
.site[aria-pressed="true"] small{color:inherit;opacity:.85;}

/* ladder */
.ladder{direction:ltr;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;}
.ladder li{text-align:center;}
.ladder .bar{border-radius:10px 10px 4px 4px;background:var(--seg-todo);color:var(--ink-2);display:flex;align-items:flex-end;justify-content:center;padding:6px 2px;font-weight:600;font-size:14px;}
.ladder li.past .bar{background:var(--seg-done);color:#fff;}
.ladder li.cur .bar{background:var(--btn);color:var(--btn-ink);}
.ladder .wk{font-size:11.5px;color:var(--ink-2);margin-top:5px;direction:rtl;min-height:1.4em;}

/* charts */
.cyc{direction:ltr;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;padding:0 2px;}
.cyc .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
.cyc .bar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--seg-todo);min-height:4px;}
.cyc .bar.s1{background:var(--seg-done);}
.cyc .bar.s2{background:var(--warn);}
.cyc .bar.s3{background:var(--alert);}
.cyc .n{font-size:12px;color:var(--ink-2);}
.cyc-l{direction:ltr;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px;}
.cyc-l span{font-size:11.5px;text-align:center;color:var(--ink-2);line-height:1.25;direction:rtl;}
.chart-box{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:12px 10px 6px;}
.wchart{direction:ltr;width:100%;height:auto;display:block;}
.wchart .wl{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
.wchart .wp{fill:var(--surface);stroke:var(--ink);stroke-width:2;}
.wchart .wg{stroke:var(--line);stroke-width:1;}
.wchart .wgoal{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 5;}
.wchart text{font:500 11px var(--font-ui);fill:var(--ink-3);}
.spark{width:88px;height:32px;flex:none;}
.spark path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;}

/* badges */
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;}
.badge.todo{background:var(--hl);color:var(--hl-ink);}
.badge.sent{background:var(--surface-2);color:var(--ink);}
.badge.paid{background:var(--ok-soft);color:var(--ok);}
.sev{display:inline-flex;gap:3px;vertical-align:middle;}
.sev i{width:7px;height:7px;border-radius:50%;background:var(--seg-todo);}
.sev i.on{background:var(--alert);}
.month-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px;font-weight:600;font-size:15px;}
.month-h span{font-weight:500;color:var(--ink-2);font-size:14px;}
.month-h b{font-weight:600;}

/* guide */
.guide details{border-top:1px solid var(--line);}
.guide details:last-of-type{border-bottom:1px solid var(--line);}
.guide summary{list-style:none;cursor:pointer;padding:17px 2px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--font-display);font-size:19px;line-height:1.3;}
.guide summary::-webkit-details-marker{display:none;}
.guide summary .ico{width:20px;height:20px;transition:transform .2s;color:var(--ink-3);flex:none;}
.guide details[open] summary .ico{transform:rotate(45deg);}
.guide details.red summary{color:var(--alert);}
.gbody{padding:0 2px 20px;font-size:15.5px;}
.gbody p{margin:0 0 10px;}
.gbody ul{margin:0 0 12px;padding-inline-start:20px;}
.gbody li{margin:0 0 7px;}
.gbody b{font-weight:600;}
.sym-g{margin:0 0 14px;}
.sym-g h4{margin:0 0 4px;font-size:15.5px;font-weight:600;}
.supp-s{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);}
.supp-s:first-of-type{border-top:0;}
.supp-s .grow p{margin:2px 0 0;font-size:14px;color:var(--ink-2);}
.idea{padding:12px 0;border-top:1px solid var(--line);}
.idea b{font-weight:600;}
.idea p{margin:2px 0 0;font-size:14.5px;color:var(--ink-2);}
.disclaimer{margin:26px 2px 0;font-size:12.5px;color:var(--ink-3);line-height:1.55;}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none;}
.sheet-wrap.open{display:block;}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim);}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:calc(100% - var(--safe-area-inset-top,env(safe-area-inset-top,0px)) - 20px);display:flex;flex-direction:column;padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px -20px rgba(0,0,0,.45);}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-wrap.open .sheet{animation:up .22s ease-out;}
.sheet:focus{outline:none;}
@media (prefers-reduced-motion:reduce){.sheet-wrap.open .sheet{animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px 4px;}
.sheet-title{font-family:var(--font-display);font-size:21px;line-height:1.25;}
.sheet-body{overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.sheet-foot{padding:10px 18px 12px;border-top:1px solid var(--line);display:flex;gap:10px;}
.sheet-foot .btn{flex:1;}
.field{display:block;margin:16px 0 0;}
.field>.fl{display:block;font-size:14px;color:var(--ink-2);margin-bottom:7px;font-weight:500;}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=time],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:48px;}
input[type=date],input[type=datetime-local],input[type=time]{direction:ltr;text-align:right;}
input[type=number]{direction:ltr;text-align:right;}
textarea{min-height:76px;resize:vertical;line-height:1.5;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tips{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px;}
.tips h4{margin:0 0 6px;font-size:14px;font-weight:600;}
.tips ul{margin:0;padding-inline-start:18px;}
.tips li{margin:0 0 4px;}
.photo{margin-top:14px;border-radius:14px;overflow:hidden;background:var(--surface-2);}
.photo img{display:block;width:100%;max-height:300px;object-fit:contain;background:#111;cursor:zoom-in;}
.photo-bar{display:flex;gap:8px;padding:8px;flex-wrap:wrap;}
.file-btn{position:relative;overflow:hidden;}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.summary-text{width:100%;min-height:300px;font-size:14px;line-height:1.6;white-space:pre-wrap;}

/* confirm, lightbox, toast */
.confirm{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--scrim);}
.confirm-box{background:var(--surface);border-radius:18px;padding:20px;max-width:360px;width:100%;}
.confirm-box p{margin:0 0 16px;font-size:16px;}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 12px) 12px calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 12px);}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;}
.lightbox .icon-btn{position:absolute;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 10px);left:10px;color:#fff;background:rgba(255,255,255,.12);}
.toast{position:fixed;left:0;right:0;bottom:calc(80px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));display:flex;justify-content:center;pointer-events:none;z-index:80;padding:0 16px;}
.toast span{background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:12px;font-size:14.5px;box-shadow:0 10px 26px -12px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:480px;}
.toast.show span{opacity:1;transform:none;}

function merge(def, val) {
  if (Array.isArray(def)) return Array.isArray(val) ? val : def.slice();
  if (def && typeof def === 'object') {
    const v = (val && typeof val === 'object' && !Array.isArray(val)) ? val : {};
    const out = {};
    for (const k of new Set([...Object.keys(def), ...Object.keys(v)])) out[k] = (k in def) ? merge(def[k], v[k]) : v[k];
    return out;
  }
  return val === undefined ? def : val;
}

const Local = {
  db: null, mem: new Map(),
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('mounjaro-journal', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
        r.onblocked = () => res();
      } catch (e) { res(); }
    });
  },
  store(mode) { return this.db.transaction('kv', mode).objectStore('kv'); },
  get(k) {
    if (!this.db) return Promise.resolve(this.mem.has(k) ? this.mem.get(k) : null);
    return new Promise(res => { try { const r = this.store('readonly').get(k); r.onsuccess = () => res(r.result == null ? null : r.result); r.onerror = () => res(null); } catch (e) { res(null); } });
  },
  set(k, v) {
    if (!this.db) { this.mem.set(k, v); return Promise.resolve(); }
    return new Promise((res, rej) => { try { const r = this.store('readwrite').put(v, k); r.onsuccess = () => res(); r.onerror = () => rej({ code: 'local_error' }); } catch (e) { rej({ code: 'local_error' }); } });
  },
  del(k) {
    if (!this.db) { this.mem.delete(k); return Promise.resolve(); }
    return new Promise(res => { try { const r = this.store('readwrite').delete(k); r.onsuccess = () => res(); r.onerror = () => res(); } catch (e) { res(); } });
  },
};

const Backend = {
  mode: 'loading', db: null, uid: null, loaded: {},
  path(k) { return `data/users/${this.uid}/${k}`; },
  async init() {
    let db = null, user = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      }
    } catch (e) { db = null; }
    let id = null;
    if (db && user) { try { id = await user.id(); } catch (e) { id = null; } }
    if (db && id) { this.mode = 'cloud'; this.db = db; this.uid = id; }
    else { this.mode = 'local'; await Local.open(); }
  },
  startCloud(done) {
    const pending = new Set(KEYS);
    let finished = false;
    const finish = () => { if (finished) return; finished = true; clearTimeout(timer); done(); };
    const timer = setTimeout(() => { App.slow = true; finish(); }, 10000);
    for (const k of KEYS) {
      let ref;
      try { ref = this.db.doc(this.path(k)); } catch (e) { pending.delete(k); continue; }
      ref.onSnapshot(snap => {
        if (!Sync.dirty[k] && !Sync.writing[k]) S[k] = merge(DEF[k], snap.exists ? clone(snap.data()) : {});
        this.loaded[k] = true;
        if (!snap.metadata || !snap.metadata.fromCache) { /* confirmed */ }
        if (pending.has(k)) { pending.delete(k); if (!pending.size) { App.slow = false; finish(); return; } }
        if (finished && App.ready) { if (App.slow && KEYS.every(x => this.loaded[x])) App.slow = false; App.render(); }

  },
  canWrite(k) { return !App.readOnly && (this.mode === 'local' || !!this.loaded[k]); },

  },

const Sync = {
  dirty: {}, writing: {}, timers: {}, retried: {},
  save(k, now) {
    this.dirty[k] = true;
    clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => this.flush(k), now ? 0 : 600);
  },
  flushAll() { for (const k of KEYS) if (this.dirty[k]) { clearTimeout(this.timers[k]); this.flush(k); } },
  async flush(k) {
    if (this.writing[k]) { clearTimeout(this.timers[k]); this.timers[k] = setTimeout(() => this.flush(k), 350); return; }
    if (!this.dirty[k]) return;
    const body = clone(S[k]);
    if (JSON.stringify(body).length > 250000) { this.dirty[k] = false; toast('הגעתם למגבלת האחסון בחלק הזה. ייצאו גיבוי ומחקו רשומות ישנות.', 'alert'); return; }
    this.writing[k] = true; this.dirty[k] = false;
    try {
      await Backend.setDoc(k, body);
      this.retried[k] = false;
    } catch (e) {
      const code = e && e.code;
      if (code === 'unavailable' && !this.retried[k]) {
        this.retried[k] = true; this.dirty[k] = true;
        clearTimeout(this.timers[k]); this.timers[k] = setTimeout(() => this.flush(k), 700 + Math.random() * 1500);
      } else if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked' || code === 'capability_disabled' || code === 'capability_removed') {
        App.readOnly = true; toast('בתצוגה הזו אי אפשר לשמור נתונים.', 'alert'); App.render();
      } else if (code === 'quota_exceeded') {

      } else {
        this.dirty[k] = true; toast('השמירה נכשלה. ננסה שוב בעוד רגע.', 'alert');
        clearTimeout(this.timers[k]); this.timers[k] = setTimeout(() => this.flush(k), 6000);
      }
    } finally { this.writing[k] = false; }
  },
};

const allInjSorted = () => S.injections.items.filter(i => parseDT(i.at)).slice().sort((a, b) => a.at < b.at ? 1 : a.at > b.at ? -1 : 0);
const injSorted = () => { const id = curMed().id; return allInjSorted().filter(i => medOf(i) === id); };
const lastInj = () => injSorted()[0] || null;
const hasDay = () => Number.isInteger(S.core.settings.day) && S.core.settings.day >= 0 && S.core.settings.day <= 6;

function nextOccurrence(from, day, time) {
  const [hh, mm] = String(time || '09:00').split(':').map(Number);
  let d = new Date(from.getFullYear(), from.getMonth(), from.getDate(), hh || 0, mm || 0);
  d = addDays(d, (day - d.getDay() + 7) % 7);
  if (d < from) d = addDays(d, 7);
  return d;
}

function schedule(now = new Date()) {
  const m = curMed();
  if (m.freq !== 'weekly') return dailyStatus(now);
  const st = S.core.settings, last = lastInj(), lastAt = last ? parseDT(last.at) : null, fixed = hasDay();
  if (!lastAt && !fixed) return { state: 'unset' };
  const gapH = m.minGap || 48, winH = m.window || null;
  let due;
  if (!lastAt) due = nextOccurrence(startOfDay(now), st.day, st.time);
  else if (fixed) { const minAt = new Date(+lastAt + gapH * HOUR); due = nextOccurrence(startOfDay(minAt), st.day, st.time); if (due < minAt) due = minAt; }
  else due = new Date(+lastAt + 7 * DAY);
  let missed = null;
  if (winH && dayDiff(due, now) < 0 && (now - due) > winH * HOUR) {
    missed = due;
    if (fixed) due = nextOccurrence(startOfDay(now), st.day, st.time);
    else { while (dayDiff(due, now) < 0) due = new Date(+due + 7 * DAY); }
  }
  const base = { due, last: lastAt, lastItem: last, missed, sinceLast: lastAt ? (now - lastAt) / DAY : null };
  base.longGap = !!lastAt && base.sinceLast > 14;
  const dl = dayDiff(due, now);
  if (dl > 0) return { ...base, state: 'upcoming', daysLeft: dl };
  if (dl === 0) return { ...base, state: 'today', daysLeft: 0 };
  return { ...base, state: 'late', deadline: winH ? new Date(+due + winH * HOUR) : null, lateDays: -dl };
}
function dailyStatus(now = new Date()) {

    const [lx, ly] = polar(cx, cy, r + 27, k * span);
    out.push(`<text class="lbl${k === 0 ? ' today' : ''}" x="${lx}" y="${ly}">${DAYS_SHORT[(now.getDay() + k) % 7]}</text>`);
  }
  return `<svg class="dial" viewBox="0 0 280 280" aria-hidden="true">${out.join('')}</svg>`;
}
function dialSVG(sc, now) {
  if (sc.state === 'daily') return dialDailySVG(sc, now);
  const cx = 140, cy = 140, r = 104, span = 360 / 7, gap = 5;
  const out = [];
  const today0 = startOfDay(now);
  const due0 = sc.due ? startOfDay(sc.due) : null;
  const last0 = sc.last ? startOfDay(sc.last) : null;
  const symDays = new Set(S.symptoms.items.map(x => String(x.at || '').slice(0, 10)));
  for (let k = 0; k < 7; k++) {
    let cls = 'todo', date = null, isToday = false;
    if (due0) {
      if (sc.state === 'late') {
        date = addDays(due0, k);
        isToday = +date === +today0;
        cls = k === 0 ? 'late' : isToday ? 'now' : date < today0 ? 'over' : 'todo';
      } else {
        date = k === 0 ? due0 : addDays(due0, k - 7);
        isToday = +date === +today0;
        if (k === 0) cls = 'due';
        else if (isToday) cls = 'now';
        else if (date < today0 && last0 && date >= last0) cls = 'done';
      }
    }
    const a0 = k * span - span / 2 + gap / 2, a1 = k * span + span / 2 - gap / 2;
    out.push(`<path class="seg ${cls}" d="${arc(cx, cy, r, a0, a1)}"/>`);
    if (date && date <= today0 && (!last0 || date >= last0) && symDays.has(toDateStr(date))) {
      const [x, y] = polar(cx, cy, r - 23, k * span); out.push(`<circle class="sdot" cx="${x}" cy="${y}" r="3.6"/>`);
    }
    if (sc.due) {
      const [lx, ly] = polar(cx, cy, r + 27, k * span);
      out.push(`<text class="lbl${isToday ? ' today' : ''}" x="${lx}" y="${ly}">${DAYS_SHORT[(sc.due.getDay() + k) % 7]}</text>`);
    }
  }
  return `<svg class="dial" viewBox="0 0 280 280" aria-hidden="true">${out.join('')}</svg>`;
}

function sparkSVG(list) {
  const pts = list.slice(-12);

}

function levelChartSVG() {

  past.push([now, amountAt(now, doses)]);
  for (let t = now; t <= t1; t += step) fut.push([t, amountAt(t, proj)]);

  const area = `M${x(past[0][0]).toFixed(1)} ${y(0).toFixed(1)} ` + past.map(q => `L${x(q[0]).toFixed(1)} ${y(q[1]).toFixed(1)}`).join(' ') + ` L${x(now).toFixed(1)} ${y(0).toFixed(1)} Z`;
  let mk = '', prev = null;
  for (const d of proj) {
    if (d.t < t0 || d.t > t1) { prev = d.mg; continue; }
    const cx = x(d.t), by = H - B + 2;
    mk += `<path class="mk${d.proj ? ' proj' : ''}" d="M${(cx - 5).toFixed(1)} ${by + 9} L${(cx + 5).toFixed(1)} ${by + 9} L${cx.toFixed(1)} ${by} Z"><title>${d.proj ? 'ההזרקה הבאה' : 'הזרקה'}: ${fmtDose(d.mg)} מ״ג</title></path>`;
    if (prev !== null && d.mg !== prev) mk += `<text x="${cx.toFixed(1)}" y="${T + 9}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmtDose(d.mg)}</text>`;
    prev = d.mg;
  }
  let sd = '';
  if (App.lvlSym) for (const q of S.symptoms.items) { const t = +parseDT(q.at); if (!t || t < t0 || t > now) continue; sd += `<circle class="sd" cx="${x(t).toFixed(1)}" cy="${y(amountAt(t, doses)).toFixed(1)}" r="${(2.6 + (+q.s || 1) * 0.55).toFixed(1)}"><title>${symDef(q.t).name}</title></circle>`; }
  let wo = '';
  if (showW) {
    const ws = S.weights.items.filter(w => w && w.d && w.kg).map(w => ({ t: +parseDT(w.d) + 12 * HOUR, kg: +w.kg })).filter(w => w.t >= t0 && w.t <= now).sort((a, b) => a.t - b.t);
    if (ws.length) {
      let mn = Math.min(...ws.map(w => w.kg)), mx = Math.max(...ws.map(w => w.kg)); const pad = Math.max(0.5, (mx - mn) * 0.15); mn -= pad; mx += pad;
      const yw = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
      wo += `<path class="wln" d="${ws.map((w, i) => `${i ? 'L' : 'M'}${x(w.t).toFixed(1)} ${yw(w.kg).toFixed(1)}`).join(' ')}"/>` + ws.map(w => `<circle class="wpt" cx="${x(w.t).toFixed(1)}" cy="${yw(w.kg).toFixed(1)}" r="3"/>`).join('');
      for (const f of [0.2, 0.8]) wo += `<text x="${W - R + 4}" y="${(T + f * (H - T - B) + 4).toFixed(1)}" text-anchor="start" style="fill:var(--ok)">${nf1(mx - (mx - mn) * f)}</text>`;
    }
  }
  const lab = `<text x="${L}" y="${H - 6}" text-anchor="start">${fmtD(new Date(t0))}</text><text x="${x(now).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="fill:var(--ink);font-weight:600">היום</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtD(new Date(t1))}</text><text x="${L - 5}" y="${T - 4}" text-anchor="end">מ״ג</text>`;

const POSES = { front: 'חזית', side: 'צד', back: 'גב' };
function weightChart(list) {
  const W = 340, H = 170, L = 38, R = 12, T = 14, B = 24;
  const pts = list.map(w => ({ t: +parseDT(w.d), kg: +w.kg })).filter(q => q.t && q.kg);
  const goal = +S.core.settings.goalKg || 0;
  let mn = Math.min(...pts.map(q => q.kg)), mx = Math.max(...pts.map(q => q.kg));
  if (goal && goal < mn && (mn - goal) <= Math.max(6, (mx - mn) * 1.5)) mn = goal;
  if (goal && goal > mx && (goal - mx) <= 6) mx = goal;
  const padY = Math.max(0.6, (mx - mn) * 0.12); mn -= padY; mx += padY;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, tr = (t1 - t0) || 1;
  const x = t => L + (t - t0) / tr * (W - L - R), y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  let g = '';
  for (const f of [0.18, 0.5, 0.82]) {

    g += `<line class="wg" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${(mx - mn) > 8 ? Math.round(v) : nf1(v)}</text>`;
  }
  if (goal && goal >= mn && goal <= mx) g += `<line class="wgoal" x1="${L}" x2="${W - R}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}"/><text x="${W - R}" y="${(y(goal) - 5).toFixed(1)}" text-anchor="end" style="fill:var(--ok)">יעד ${nf1(goal)}</text>`;
  const hist = doseHistory();
  for (let i = 1; i < hist.length; i++) { const t = +startOfDay(parseDT(hist[i].from)); if (t > t0 && t < t1) { const xx = x(t).toFixed(1); g += `<line class="dl" x1="${xx}" x2="${xx}" y1="${T}" y2="${H - B}"/><text x="${xx}" y="${T + 8}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmtDose(hist[i].dose)}</text>`; } }
  const d = pts.map((q, i) => `${i ? 'L' : 'M'}${x(q.t).toFixed(1)} ${y(q.kg).toFixed(1)}`).join(' ');
  const dots = pts.length <= 40 ? pts.map(q => `<circle class="wp" cx="${x(q.t).toFixed(1)}" cy="${y(q.kg).toFixed(1)}" r="3.2"/>`).join('') : '';

  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף משקל לאורך זמן">${g}<path class="wl" d="${d}"/>${dots}${lab}</svg>`;

}

function receiptsBody() {
  const rs = receiptStats();
  let h = '';
  h += `<dl class="stats"><div><dt>החודש</dt><dd>${money(rs.month)}</dd></div><div><dt>סה״כ</dt><dd>${money(rs.total)}</dd></div><div><dt>החזרים</dt><dd>${money(rs.refunds)}</dd></div></dl>`;
  if (rs.refunds) h += `<p class="tiny muted mt center">עלות נטו אחרי החזרים: ${money(rs.net)}</p>`;
  if (rs.pending) h += `<div class="note hl">${rs.pending === 1 ? 'קבלה אחת מחכה' : `${rs.pending} קבלות מחכות`} להגשה לביטוח.</div>`;
  h += `<button class="btn block" style="margin-top:16px" data-act="add-receipt">${ICON.cam} קבלה חדשה</button>`;
  const FL = [['all', 'הכול'], ['todo', 'להגשה'], ['sent', 'הוגשו'], ['paid', 'התקבל החזר']];
  h += `<div class="chips" style="margin-top:18px" role="group" aria-label="סינון קבלות">${FL.map(([k, l]) => `<button class="chip" data-act="rfilter" data-k="${k}" aria-pressed="${App.rFilter === k}">${l}</button>`).join('')}</div>`;
  let items = S.receipts.items.slice().sort((a, b) => (a.d || '') < (b.d || '') ? 1 : (a.d || '') > (b.d || '') ? -1 : 0);
  if (App.rFilter !== 'all') items = items.filter(r => r.st === App.rFilter);
  if (!items.length) h += `<div class="group mt"><div class="empty">${S.receipts.items.length ? 'אין קבלות בסינון הזה.' : 'עוד אין קבלות. צלמו קבלה מבית המרקחת כדי לעקוב אחרי ההוצאות וההחזרים מהביטוח.'}</div></div>`;
  const groups = new Map();
  for (const r of items) { const ym = (r.d || '').slice(0, 7); if (!groups.has(ym)) groups.set(ym, []); groups.get(ym).push(r); }
  for (const [ym, arr] of groups) {
    const [y, m] = ym.split('-').map(Number);
    const sum = arr.reduce((a, r) => a + (+r.amt || 0), 0);
    h += `<div class="month-h"><b>${m ? `${MONTHS[m - 1]} ${y}` : 'ללא תאריך'}</b><span>${money(sum)}</span></div><div class="group">`;
    for (const r of arr) {
      const d = parseDT(r.d);
      h += `<button class="row" data-act="edit-receipt" data-id="${esc(r.id)}"><div class="grow"><div class="row-title">${esc(r.v || CATS[r.c] || 'קבלה')}</div><div class="row-sub">${d ? fmtD(d) : ''}${r.c ? `, ${CATS[r.c] || ''}` : ''}${r.img ? ` ${ICON.photoSmall}<span class="sr">יש תמונה</span>` : ''}</div></div><div class="end"><div class="num" style="font-weight:600">${money(r.amt)}</div>${r.st && r.st !== 'none' ? `<span class="badge ${r.st}">${STATUS[r.st] || ''}</span>` : ''}</div></button>`;
    }
    h += '</div>';
  }
  if (S.receipts.items.length) h += `<p class="tiny muted mt">קבלות עם תמונה נשמרות יחד עם התמונה. אפשר לפתוח קבלה ולהגדיל את התמונה כדי להציג אותה בהגשה לביטוח.</p>`;
  return h;
}

async function doExport() { await saveFile(`myshot-backup-${todayStr()}.json`, await buildBackupJSON(), 'הגיבוי נשמר'); }
async function doImport(file) {
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('הקובץ לא נקרא. בחרו קובץ גיבוי של היומן.', 'alert'); return; }
  if (!data || data.app !== 'mounjaro-journal' || !data.docs || typeof data.docs !== 'object') { toast('זה לא קובץ גיבוי של היומן.', 'alert'); return; }
  if (!KEYS.every(k => Backend.canWrite(k))) { toast('הנתונים עדיין נטענים. נסו שוב בעוד רגע.', 'alert'); return; }
  if (!(await confirmBox('הייבוא יחליף את כל הנתונים הנוכחיים בנתונים מהגיבוי. להמשיך?', 'ייבוא', false))) return;
  let failed = 0;
  for (const [id, src] of Object.entries(data.images || {})) {
    if (!/^[a-z0-9]{6,40}$/i.test(id) || typeof src !== 'string' || !src.startsWith('data:image/') || src.length > 240000) continue;
    try { await Backend.setImg(id, { src, at: new Date().toISOString() }); imgCache.set(id, src); } catch (e) { failed++; }
  }
  for (const [id, ph] of Object.entries(data.photos || {})) {
    if (!/^[a-z0-9]{6,40}$/i.test(id) || !ph || typeof ph.src !== 'string' || !ph.src.startsWith('data:image/') || ph.src.length > 240000) continue;
    try { await Backend.setBlob('ph-' + id, { src: ph.src, at: new Date().toISOString() }); if (typeof ph.thumb === 'string' && ph.thumb.startsWith('data:image/') && ph.thumb.length < 100000) await Backend.setBlob('pt-' + id, { src: ph.thumb }); photoCache.set(id, ph.src); } catch (e) { failed++; }
  }
  for (const k of KEYS) { S[k] = merge(DEF[k], data.docs[k] || {}); Sync.save(k, true); }
  Sheet.close(); App.render(); toast(failed ? `הגיבוי יובא, אבל ${failed} תמונות לא נשמרו.` : 'הגיבוי יובא');
}
async function doWipe() {

}

    case 'meal-rephoto': {
      readItemEditor(); F.editIdx = null;
      if (F.aiBatch) { const old = new Set(F.aiBatch); F.items = F.items.filter(x => !old.has(x)); F.aiBatch = null; renderItems(); }
      setAux('');
      if (!(Native.on && Native.plugin('Camera'))) { const inp = document.querySelector('#sheet input[data-file="meal"][capture]'); if (inp) inp.click(); }
      else nativePhoto('meal', true);
      break;
    }
    case 'ai-setup': openSettings(); setTimeout(() => { const h = Array.from(document.querySelectorAll('#sheet h3')).find(x => x.textContent.includes('בינה מלאכותית')); if (h) h.scrollIntoView({ block: 'start' }); }, 80); break;
    case 'cnt': { F.count = Math.max(1, Math.min(10, (+F.count || 1) + +d.n)); const el = $('#f-cnt'); if (el) el.textContent = F.count; break; }
    case 'go-supps': Sheet.close(); setTab('supps'); break;
    case 'seg': if (d.g === 'food' && (d.k === 'meals' || d.k === 'supps')) App.foodSeg = d.k; if (d.g === 'track' && ['summary', 'symptoms', 'body', 'train'].includes(d.k)) App.trackSeg = d.k; App.render(); window.scrollTo(0, 0); break;
    case 'more-go': { App.more = d.k || null; App.tab = 'more'; if (d.open) App.openGuide.add(d.open); App.render(); window.scrollTo(0, 0); if (d.open) setTimeout(() => { const el = document.getElementById(d.open); if (el) el.scrollIntoView({ block: 'start' }); }, 30); break; }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (!t || !t.matches) return;
  if (t.matches('input[data-file="receipt"]')) { const f = t.files && t.files[0]; handleReceiptFile(f); }
  else if (t.matches('input[data-file="import"]')) { const f = t.files && t.files[0]; t.value = ''; doImport(f); }
  else if (t.matches('input[data-file="meal"]')) { const f = t.files && t.files[0]; t.value = ''; handleMealPhoto(f); }
  else if (t.matches('input[data-file="label"]')) { const f = t.files && t.files[0]; t.value = ''; handleLabelPhoto(f); }
  else if (t.matches('input[data-file="progress"]')) { const f = t.files && t.files[0]; handleProgressFile(f); }
  else if (t.matches('input[data-file="supp"]')) { const f = t.files && t.files[0]; t.value = ''; handleSuppPhoto(f); }
  else if ((t.id === 'f-ca' || t.id === 'f-cb') && F.kind === 'cmp') { F[t.id === 'f-ca' ? 'a' : 'b'] = t.value; renderCompare($('#sheet')); }
});

document.addEventListener('toggle', e => {
  const el = e.target;
  if (el && el.tagName === 'DETAILS' && el.id) { if (el.open) App.openGuide.add(el.id); else App.openGuide.delete(el.id); }
}, true);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const o = $('#overlay');
    if (o.firstElementChild) { if (!o.querySelector('.confirm')) o.innerHTML = ''; return; }
    if (Sheet.isOpen()) Sheet.close();
    return;
  }
  if (e.key === 'Enter' && e.target && e.target.id === 'f-sname') { e.preventDefault(); suppAdd(e.target.value); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t && t.id === 'f-cm-doses' && (F.kind === 'set' || F.kind === 'onb')) { F.cmDoses = t.value; const mm = formMed(); if (!mm.doses.includes(F.dose)) F.dose = mm.doses[0]; const box = $('#f-dose-chips'); if (box) box.innerHTML = doseChipsFor(mm); }
  if (t && t.id === 'f-sn' && F.kind === 'suppedit') { const box = $('#f-stip'); if (box) { const tip = suppTip(t.value); box.innerHTML = tip ? `<div class="tips"><h4>מתי כדאי לקחת</h4><p style="margin:0">${tip}</p></div>` : ''; } }
  if (t && t.dataset && t.dataset.ghost) { const img = document.getElementById(t.dataset.ghost); if (img) img.style.opacity = String(+t.value / 100); if (F.kind === 'cmp') F.op = +t.value; }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON' && t.dataset && t.dataset.act) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});

async function initOptional() {
  if (Native.on || !window.claude || typeof window.claude.use !== 'function') return;
  try {
    const s = await window.claude.use('sample');
    if (s) {
      App.sample = s;
      try { const lim = await s.limits(); App.sampleImg = !!(lim && lim.images); } catch (e) { App.sampleImg = false; }
      if (App.ready) App.render();
      if (Sheet.isOpen() && F.kind === 'r' && !F.imgLoading) renderPhoto($('#sheet'));
    }
  } catch (e) {}
  try { const dl = await window.claude.use('downloads'); if (dl) App.downloads = dl; } catch (e) {}
}

async function boot() {
  applyTheme();
  window.addEventListener('scroll', () => { $('#top').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') Sync.flushAll();
    else if (App.ready && !Sheet.isOpen()) App.render();
  });
  window.addEventListener('pagehide', () => Sync.flushAll());
  setInterval(() => { if (App.ready && !Sheet.isOpen()) App.render(); }, 5 * 60 * 1000);
  initOptional();
  if (Lock.on()) Lock.show();
  setTimeout(() => GDrive.auto(), 5000);
  syncThemeBtn();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => syncThemeBtn(true)); } catch (e) {}
  AIKeys.setup();
  nativeBoot();
  await Backend.init();
  const done = () => {
    if (App.ready) return;
    App.ready = true; App.render();
    if (Native.on) { Reminders.flush(); Reminders.soon(800); }
    if (App.afterReady) { const f = App.afterReady; App.afterReady = null; setTimeout(() => Lock.whenOpen(f), 300); }
    if (Backend.loaded.core && !S.core.settings.setup && !App.readOnly && !App.slow) setTimeout(() => { if (!Sheet.isOpen()) openOnboarding(); }, 300);
  };
  if (Backend.mode === 'cloud') Backend.startCloud(done);
  else { await Backend.loadLocal(); done(); }
}
boot();
})();
</script>
</body>
</html>
