name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  # Automated checks: the app runs in headless Chromium with the Android plugins and the
  # AI/Google services mocked. If any check fails, the APK is not built.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Playwright
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet playwright
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Run the checks
        run: .venv/bin/python tests/run_tests.py

  apk:
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # Automatic Drive backup: only when the repository variable GOOGLE_WEB_CLIENT_ID is set
      # (Settings → Secrets and variables → Actions → Variables). Without it the build is unchanged.
      - name: Google sign-in for Drive backup (optional)
        if: ${{ vars.GOOGLE_WEB_CLIENT_ID != '' }}
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          npm install @capgo/capacitor-social-login@^8
          printf "window.MYSHOT_GOOGLE_WEB_CLIENT_ID = '%s';\n" "$GOOGLE_WEB_CLIENT_ID" > www/google-config.js

      - name: Create the Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          node scripts/patch-android.mjs
          npx capacitor-assets generate --android
          npx cap sync android

      # Same signing key on every run, so a new APK installs over the old one and keeps the data.
      - name: Use the project's fixed debug key
        run: mkdir -p ~/.android && cp ci/debug-signing.p12 ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MyShot.apk

      - uses: actions/upload-artifact@v6
        with:
          name: MyShot-apk
          path: MyShot.apk

      # Also publish the APK under Releases, so the phone can download it directly.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          VER=$(grep -oE "APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" www/index.html | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MyShot.apk --clobber
          else
            gh release create "$TAG" MyShot.apk --target "$GITHUB_SHA" --title "MyShot ${VER} (build ${GITHUB_RUN_NUMBER})" --notes "Built from commit ${GITHUB_SHA::7}." --latest
          fi

      # Optional: signed release APK + AAB for Google Play. Runs only if the four signing secrets are set.
      - name: Signed release (APK + AAB)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out ../MyShot-release.apk "$RUNNER_TEMP/aligned.apk"
          cp app/build/outputs/bundle/release/app-release.aab ../MyShot-release.aab
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" ../MyShot-release.aab "$KEY_ALIAS"

      - uses: actions/upload-artifact@v6
        if: env.KEYSTORE_B64 != ''
        with:
          name: MyShot-release
          path: |
            MyShot-release.apk
            MyShot-release.aab
