name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
            node scripts/patch-android.mjs
          fi
          npx capacitor-assets generate --android
          npx cap sync android

      # Same signing key on every run, so a new APK installs over the old one and keeps the data.
      - name: Use the project's fixed debug key
        run: mkdir -p ~/.android && cp ci/debug-signing.p12 ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MyShot.apk

      - uses: actions/upload-artifact@v6
        with:
          name: MyShot-apk
          path: MyShot.apk

      # Optional: signed release APK + AAB for Google Play. Runs only if the four signing secrets are set.
      - name: Signed release (APK + AAB)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out ../MyShot-release.apk "$RUNNER_TEMP/aligned.apk"
          cp app/build/outputs/bundle/release/app-release.aab ../MyShot-release.aab
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" ../MyShot-release.aab "$KEY_ALIAS"

      - uses: actions/upload-artifact@v6
        if: env.KEYSTORE_B64 != ''
        with:
          name: MyShot-release
          path: |
            MyShot-release.apk
            MyShot-release.aab
